  <rect x="130" y="230" width="940" height="1120" rx="34" fill="#000" opacity="0.22" stroke="#fef9c3" stroke-opacity="0.18"/>
  <text x="600" y="185" text-anchor="middle" font-size="54" font-family="Microsoft YaHei, SimHei, sans-serif" fill="#fef9c3" opacity="0.92">玄幻经营</text>
  <text x="600" y="440" text-anchor="middle" font-size="94" font-weight="800" font-family="Microsoft YaHei, SimHei, sans-serif" fill="#fef9c3">

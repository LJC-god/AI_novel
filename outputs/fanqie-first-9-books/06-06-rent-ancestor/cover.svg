  <text x="600" y="1280" text-anchor="middle" font-size="42" font-family="Microsoft YaHei, SimHei, sans-serif" fill="#fef9c3" opacity="0.85">主角 陆闲</text>
  <text x="600" y="1350" text-anchor="middle" font-size="34" font-family="Microsoft YaHei, SimHei, sans-serif" fill="#fef9c3" opacity="0.72">把债务变成影响力生意，让祖师爷一边骂一边营业</text>
